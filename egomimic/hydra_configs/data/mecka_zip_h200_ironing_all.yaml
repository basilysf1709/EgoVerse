# 4×H200 — IRONING_CLOTHES, ALL AVAILABLE (~33.5h). (64/GPU → 256 global batch.)
#
# Every ironing_clothes episode currently staged in the modal zip volume
# (mecka_data_zip): 1251 episodes ≈ 33.5h. This is the FULL availability, not the
# ~30h cap used by mecka_zip_h200_ironing_30h (1121 eps) — the existing 30h JSON
# was capped at hours_to_episodes(30)=1121, leaving ~130 eps (~3.5h) on the table.
# Top of the ironing data-scaling ladder; subsets are strictly NESTED:
#   mecka_ironing_5h.json ⊂ _10h ⊂ _30h ⊂ mecka_ironing_all.json
# (SQL holds ~146h / 5447 eps of ironing_clothes, but only these 1251 are present
#  in the volume catalog — we use all confirmed-present episodes, not the SQL set.)
#
#   33.5h × 3600 s/h × 30 fps = 3,618,000 samples (frames) ÷ global batch 256
#   = 14,133 steps per pass.
# (30 fps is the recording rate — catalog mean ≈ 2890 frames / ~96.35 s ep.)
# Global batch 256 = 4×H200 DDP × batch_size 64 per device.
# NOTE: this config is paired with the existing pi0.5_ironing30h_lr* model
# configs (same step horizon as the 10h/30h runs).
#
#   task: ironing_clothes   subset = 1251 eps (~33.5h @ ~96 s/ep)
#   split: ~1126 train / ~125 valid (resolver valid_ratio=0.1)
#
# Subset = all ironing_clothes hashes present in the volume catalog, pinned via
# the resolver's `eps_to_use` allowlist (mecka_ironing_all.json). Per-episode
# frame counts are read from each staged zarr's metadata at index_map build time.
# train_viz: one mid-trajectory sample.
#
# Launch (4×H200, PI/PaliGemma scratch + pretrained backbone, 64/GPU = 256
# global batch):
#   python egomimic/modal/trainModal.py --config-name=train_zarr_cartesian_pi \
#     data=mecka_zip_h200_ironing_all logger=wandb \
#     model=pi0.5_ironing30h_lr5e5 \
#     model.robomimic_model.config.paligemma_weight_path=paligemma_weights/paligemma-3b-pt-224 \
#     name=<run> description=<desc> \
#     evaluator@train_viz_evaluator=train_viz_pi \
#     trainer.check_val_every_n_epoch=50 trainer.limit_val_batches=10 \
#     +modal_gpu=H200:4 +modal_cpu=64 +modal_memory_gb=256 \
#     +modal_volume=mecka_data_zip +modal_ephemeral_disk_gb=1024 \
#     norm_stats.precomputed_norm_path=precomputed_norm_stats/mecka_all_zarr
#
# Storage (~1251 × ~198 MB ≈ 248 GB): pools train 320 + valid 45 + viz 10 ≈
# 375 GB caps, within the 1 TB (1024 GiB) ephemeral disk. Stage-all sizing: the
# train split (~1126 eps × 198 MB ≈ 223 GB) must fit under 0.92×pool_size_gb=294 GB —
# the 320 GB pool clears it with ~71 GB margin so the PoolFillerThread never deadlocks.

_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

use_tokenizer: true
model_name: "google/paligemma-3b-mix-224"
sampling_mode: random
annotation_key: annotations
default_prompt: ""

train_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.prefetch_dataset.PrefetchedMapDataset
    resolver:
      _target_: egomimic.rldb.zarr.prefetch_dataset.ZipEpisodeResolver
      zip_dir: /mnt/zarr-zip
      eps_to_use: egomimic/hydra_configs/data/extra/mecka_ironing_all.json
      debug: null
      min_frames: null
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
        annotations: true
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
    mode: train
    episodes_per_epoch: 1251    # == full subset → stage-all before training
    epoch_frames: ${multiply:${trainer.limit_train_batches},${data.train_dataloader_params.mecka_bimanual.batch_size}}
    cache_dir: /cache/zarr_cache
    pool_size_gb: 320           # holds all ~1126 train eps (~223 GB measured) under 0.92 gate (294 GB); no eviction
    lookahead_epochs: 2.0
    n_copy_threads: 48
    prepare_timeout_s: 5400     # ~248 GB off the ~150 MB/s volume; 48 copy threads cut it well under 90 min

valid_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.prefetch_dataset.PrefetchedMapDataset
    resolver:
      _target_: egomimic.rldb.zarr.prefetch_dataset.ZipEpisodeResolver
      zip_dir: /mnt/zarr-zip
      eps_to_use: egomimic/hydra_configs/data/extra/mecka_ironing_all.json
      debug: null
      min_frames: null
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
        annotations: true
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
    mode: valid
    episodes_per_epoch: 130     # full valid split (~125, ~10% of 1251)
    cache_dir: /cache/zarr_cache_valid
    pool_size_gb: 45            # holds all ~125 valid eps (~25 GB)
    lookahead_epochs: 2.0
    n_copy_threads: 16
    prepare_timeout_s: 5400

train_viz_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.prefetch_dataset.PrefetchedMapDataset
    resolver:
      _target_: egomimic.rldb.zarr.prefetch_dataset.ZipEpisodeResolver
      zip_dir: /mnt/zarr-zip
      eps_to_use: egomimic/hydra_configs/data/extra/mecka_ironing_all_viz.json
      valid_ratio: 1.0          # keep all viz episodes (no split)
      debug: null
      min_frames: null
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
        annotations: true
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
    mode: valid
    episodes_per_epoch: 1       # == n_tasks
    epoch_frames: 1             # max_frames_per_episode=1 → 1 sample per task
    max_frames_per_episode: 1
    cache_dir: /cache/zarr_cache_viz
    pool_size_gb: 10
    lookahead_epochs: 1.0
    n_copy_threads: 4
    prepare_timeout_s: 3600

train_dataloader_params:
  mecka_bimanual:
    batch_size: 64            # per-device; 4×H200 → 256 global batch
    num_workers: 16
    persistent_workers: false
    prefetch_factor: 6
    shuffle: true

valid_dataloader_params:
  mecka_bimanual:
    batch_size: 32
    num_workers: 4
    persistent_workers: false
    prefetch_factor: 2
    shuffle: false

train_viz_dataloader_params:
  mecka_bimanual:
    batch_size: 80            # ≥ n_tasks (1) → all task-frames in ONE batch (matches eval's max-batch=80); limit_val_batches can't truncate a task
    num_workers: 1
    persistent_workers: false
    prefetch_factor: 2
    shuffle: false
