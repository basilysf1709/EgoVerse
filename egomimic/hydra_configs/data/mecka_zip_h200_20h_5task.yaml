# 2×H200 — TASK-SCALING SWEEP, point 2 of 3: ~20h balanced over 5 tasks.
#
# Sweep design: total data is held fixed at ~20h while task diversity grows
# (1 → 5 → 10 tasks). This config spreads the 20h evenly over the top 5 tasks
# (~4h/task). The task set is nested: it contains the 1-task config's task and
# is contained by the 10-task config's set.
#
#   tasks: potting_plants, packaging_snacks, cleaning_shoes, ironing_clothes,
#          repairing_phones   (top 5 by available episodes)
#   subset≈745 eps (~20h, ~4h/task); split ~671 train / ~74 valid (valid_ratio=0.1)
#
# Subset selected offline by build_task_subset_configs.py and pinned via the
# resolver's `eps_to_use` allowlist (mecka_20h_5task.json). Per-episode frame
# counts are read from each staged zarr's metadata at index_map build time.
# train_viz: one mid-trajectory sample per task (5 samples).
#
# Launch (2×H200, batch 64, 2 lookahead epochs, 48/16 copy threads):
#   python egomimic/modal/trainModal.py \
#     data=mecka_zip_h200_20h_5task trainer=ddp_modal logger=wandb \
#     model=hpt_bc_flow_mecka_300m name=<run> description=<desc> \
#     evaluator@train_viz_evaluator=train_viz_pi \
#     trainer.check_val_every_n_epoch=5 trainer.limit_val_batches=10 \
#     +modal_gpu=H200:2 +modal_cpu=48 +modal_memory_gb=200 \
#     +modal_volume=mecka_data_zip +modal_ephemeral_disk_gb=512 \
#     norm_stats.precomputed_norm_path=precomputed_norm_stats/mecka_all_zarr \
#     init_submodules=false
#
# Storage (~745 × ~150 MB ≈ 112 GB): pools train 150 + valid 40 + viz 10 ≈
# 200 GB, under Modal's 512 GiB ephemeral floor. Stage-all sizing: the train
# split (~671 eps × 150 MB ≈ 101 GB) must fit under 0.92×pool_size_gb=138 GB —
# 150 GB pool leaves ~37 GB margin so the PoolFillerThread never deadlocks.

_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

use_tokenizer: true
model_name: "google/paligemma-3b-mix-224"
sampling_mode: random
annotation_key: annotations
default_prompt: ""

train_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.prefetch_dataset.PrefetchedMapDataset
    resolver:
      _target_: egomimic.rldb.zarr.prefetch_dataset.ZipEpisodeResolver
      zip_dir: /mnt/zarr-zip
      eps_to_use: egomimic/hydra_configs/data/extra/mecka_20h_5task.json
      debug: null
      min_frames: null
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
        annotations: true
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
    mode: train
    episodes_per_epoch: 745     # == full subset → stage-all before training
    epoch_frames: ${multiply:${trainer.limit_train_batches},${data.train_dataloader_params.mecka_bimanual.batch_size}}
    cache_dir: /cache/zarr_cache
    pool_size_gb: 150           # holds all ~671 train eps (~101 GB) under 0.92 gate; no eviction
    lookahead_epochs: 2.0
    n_copy_threads: 48
    prepare_timeout_s: 3600     # 1h is ample for ~750 eps off the ~150 MB/s volume

valid_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.prefetch_dataset.PrefetchedMapDataset
    resolver:
      _target_: egomimic.rldb.zarr.prefetch_dataset.ZipEpisodeResolver
      zip_dir: /mnt/zarr-zip
      eps_to_use: egomimic/hydra_configs/data/extra/mecka_20h_5task.json
      debug: null
      min_frames: null
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
        annotations: true
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
    mode: valid
    episodes_per_epoch: 80      # full valid split (~74, ~10% of 745)
    cache_dir: /cache/zarr_cache_valid
    pool_size_gb: 40            # holds all ~74 valid eps (~11 GB)
    lookahead_epochs: 2.0
    n_copy_threads: 16
    prepare_timeout_s: 3600

train_viz_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.prefetch_dataset.PrefetchedMapDataset
    resolver:
      _target_: egomimic.rldb.zarr.prefetch_dataset.ZipEpisodeResolver
      zip_dir: /mnt/zarr-zip
      eps_to_use: egomimic/hydra_configs/data/extra/mecka_20h_5task_viz.json
      valid_ratio: 1.0          # keep all viz episodes (no split)
      debug: null
      min_frames: null
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
        annotations: true
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
    mode: valid
    episodes_per_epoch: 5       # == n_tasks
    epoch_frames: 5             # max_frames_per_episode=1 → 1 sample per task
    max_frames_per_episode: 1
    cache_dir: /cache/zarr_cache_viz
    pool_size_gb: 10
    lookahead_epochs: 1.0
    n_copy_threads: 4
    prepare_timeout_s: 3600

train_dataloader_params:
  mecka_bimanual:
    batch_size: 64
    num_workers: 12
    persistent_workers: false
    prefetch_factor: 6
    shuffle: true

valid_dataloader_params:
  mecka_bimanual:
    batch_size: 64
    num_workers: 4
    persistent_workers: false
    prefetch_factor: 2
    shuffle: false

train_viz_dataloader_params:
  mecka_bimanual:
    batch_size: 80            # ≥ n_tasks (5) → all task-frames in ONE batch (matches eval's max-batch=80); limit_val_batches can't truncate a task
    num_workers: 2
    persistent_workers: false
    prefetch_factor: 2
    shuffle: false
