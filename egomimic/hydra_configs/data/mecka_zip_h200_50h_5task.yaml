# 4×H200 — STAGE-ALL-FIRST over 5 tasks, ~50h balanced (~10h/task, 1870 episodes).
#
# Task-balanced subset selected offline by build_task_subset_configs.py and
# pinned via the resolver's `eps_to_use` allowlist. Balanced: 10h (~374 eps)
# randomly sampled per task.
#   tasks: potting_plants, packaging_snacks, cleaning_shoes, ironing_clothes,
#          repairing_phones   (top 5 by available episodes)
#
# Per-episode frame counts come from the staged zarr metadata, not the catalog.
# train_viz: one mid-trajectory sample per task (5 samples).
#
# Launch:
#   python egomimic/modal/trainModal.py \
#     data=mecka_zip_h200_50h_5task trainer=ddp_modal logger=wandb \
#     model=hpt_bc_flow_mecka_300m name=<run> description=<desc> \
#     evaluator@train_viz_evaluator=train_viz_pi \
#     trainer.check_val_every_n_epoch=5 trainer.limit_val_batches=10 \
#     +modal_gpu=H200:4 +modal_cpu=64 +modal_memory_gb=200 \
#     +modal_volume=mecka_data_zip +modal_ephemeral_disk_gb=400 \
#     norm_stats.precomputed_norm_path=precomputed_norm_stats/mecka_all_zarr \
#     init_submodules=false
#
# Storage (~1870 × ~131 MB ≈ 245 GB): train pool 300 GB, valid pool 60 GB.

_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

use_tokenizer: true
model_name: "google/paligemma-3b-mix-224"
sampling_mode: random
annotation_key: annotations
default_prompt: ""

train_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.prefetch_dataset.PrefetchedMapDataset
    resolver:
      _target_: egomimic.rldb.zarr.prefetch_dataset.ZipEpisodeResolver
      zip_dir: /mnt/zarr-zip
      eps_to_use: egomimic/hydra_configs/data/extra/mecka_50h_5task.json
      debug: null
      min_frames: null
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
        annotations: true
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
    mode: train
    episodes_per_epoch: 1870    # == full subset → stage-all before training
    epoch_frames: ${multiply:${trainer.limit_train_batches},${data.train_dataloader_params.mecka_bimanual.batch_size}}
    cache_dir: /cache/zarr_cache
    pool_size_gb: 300           # holds all ~1683 train eps (no eviction)
    lookahead_epochs: 1.0
    n_copy_threads: 48
    prepare_timeout_s: 7200     # 2h — staging ~1870 eps off the ~150 MB/s volume

valid_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.prefetch_dataset.PrefetchedMapDataset
    resolver:
      _target_: egomimic.rldb.zarr.prefetch_dataset.ZipEpisodeResolver
      zip_dir: /mnt/zarr-zip
      eps_to_use: egomimic/hydra_configs/data/extra/mecka_50h_5task.json
      debug: null
      min_frames: null
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
        annotations: true
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
    mode: valid
    episodes_per_epoch: 200     # full valid split (~10% of 1870)
    cache_dir: /cache/zarr_cache_valid
    pool_size_gb: 60
    lookahead_epochs: 1.0
    n_copy_threads: 16
    prepare_timeout_s: 7200

train_viz_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.prefetch_dataset.PrefetchedMapDataset
    resolver:
      _target_: egomimic.rldb.zarr.prefetch_dataset.ZipEpisodeResolver
      zip_dir: /mnt/zarr-zip
      eps_to_use: egomimic/hydra_configs/data/extra/mecka_50h_5task_viz.json
      valid_ratio: 1.0          # keep all viz episodes (no split)
      debug: null
      min_frames: null
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
        annotations: true
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
    mode: valid
    episodes_per_epoch: 5       # == n_tasks
    epoch_frames: 5             # max_frames_per_episode=1 → 1 sample per task
    max_frames_per_episode: 1
    cache_dir: /cache/zarr_cache_viz
    pool_size_gb: 10
    lookahead_epochs: 1.0
    n_copy_threads: 4
    prepare_timeout_s: 3600

train_dataloader_params:
  mecka_bimanual:
    batch_size: 128
    num_workers: 12
    persistent_workers: false
    prefetch_factor: 6
    shuffle: true

valid_dataloader_params:
  mecka_bimanual:
    batch_size: 128
    num_workers: 4
    persistent_workers: false
    prefetch_factor: 2
    shuffle: false

train_viz_dataloader_params:
  mecka_bimanual:
    batch_size: 5             # == n_tasks → one batch covers one sample per task
    num_workers: 2
    persistent_workers: false
    prefetch_factor: 2
    shuffle: false
