# 4×H200 — STAGE-ALL-FIRST over 25 tasks, ALL their episodes (~528h, 19736 eps).
#
# Task subset selected offline by build_task_subset_configs.py, pinned via the
# resolver's `eps_to_use` allowlist. The original target was "500h balanced
# across 25 tasks", which is infeasible: only 11 tasks have >=20h, and the top
# 25 tasks total ~528h and are lopsided (49h … 9.6h). Per direction, this config
# takes ALL episodes of the top-25 tasks (closest to 500h; not balanced).
#   tasks: potting_plants, packaging_snacks, cleaning_shoes, ironing_clothes,
#          repairing_phones, wrapping_flowers, repairing_electronics, filling_bags,
#          dishwashing, folding_clothes, sewing_clothes, assembling_flowers,
#          arranging_flowers, making_flowers, planting_seedlings, folding_boxes,
#          weeding_plants, repairing_laptops, packaging_items, packing_snacks,
#          wrapping_bouquets, clearing_weeds, stringing_beads, woodworking,
#          shaping_dough
#
# Per-episode frame counts come from the staged zarr metadata, not the catalog.
# train_viz: one mid-trajectory sample per task (25 samples).
#
# Launch (sized like the 20k staged run — 3 TiB ephemeral, full stage budget):
#   python egomimic/modal/trainModal.py \
#     data=mecka_zip_h200_500h_25task trainer=ddp_modal logger=wandb \
#     model=hpt_bc_flow_mecka_300m name=<run> description=<desc> \
#     evaluator@train_viz_evaluator=train_viz_pi \
#     trainer.check_val_every_n_epoch=5 trainer.limit_val_batches=10 \
#     +modal_gpu=H200:4 +modal_cpu=64 +modal_memory_gb=200 \
#     +modal_volume=mecka_data_zip +modal_ephemeral_disk_gb=3000 \
#     norm_stats.precomputed_norm_path=precomputed_norm_stats/mecka_all_zarr \
#     init_submodules=false
#
# Storage (~19736 × ~131 MB ≈ 2.58 TB; 3 TiB ephemeral cap):
#   train pool 2900 GB, valid pool 400 GB, /cache ~30 GB.

_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

use_tokenizer: true
model_name: "google/paligemma-3b-mix-224"
sampling_mode: random
annotation_key: annotations
default_prompt: ""

train_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.prefetch_dataset.PrefetchedMapDataset
    resolver:
      _target_: egomimic.rldb.zarr.prefetch_dataset.ZipEpisodeResolver
      zip_dir: /mnt/zarr-zip
      eps_to_use: egomimic/hydra_configs/data/extra/mecka_500h_25task.json
      debug: null
      min_frames: null
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
        annotations: true
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
    mode: train
    episodes_per_epoch: 19736   # == full subset → stage-all before training
    epoch_frames: ${multiply:${trainer.limit_train_batches},${data.train_dataloader_params.mecka_bimanual.batch_size}}
    cache_dir: /cache/zarr_cache
    pool_size_gb: 2900          # holds all ~17.8k train eps (no eviction)
    lookahead_epochs: 1.0
    n_copy_threads: 48
    prepare_timeout_s: 21600    # 6h — stage-all of ~20k eps off the ~150 MB/s volume

valid_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.prefetch_dataset.PrefetchedMapDataset
    resolver:
      _target_: egomimic.rldb.zarr.prefetch_dataset.ZipEpisodeResolver
      zip_dir: /mnt/zarr-zip
      eps_to_use: egomimic/hydra_configs/data/extra/mecka_500h_25task.json
      debug: null
      min_frames: null
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
        annotations: true
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
    mode: valid
    episodes_per_epoch: 2000    # full valid split (~10% of 19736)
    cache_dir: /cache/zarr_cache_valid
    pool_size_gb: 400
    lookahead_epochs: 1.0
    n_copy_threads: 16
    prepare_timeout_s: 21600

train_viz_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.prefetch_dataset.PrefetchedMapDataset
    resolver:
      _target_: egomimic.rldb.zarr.prefetch_dataset.ZipEpisodeResolver
      zip_dir: /mnt/zarr-zip
      eps_to_use: egomimic/hydra_configs/data/extra/mecka_500h_25task_viz.json
      valid_ratio: 1.0          # keep all viz episodes (no split)
      debug: null
      min_frames: null
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
        annotations: true
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
    mode: valid
    episodes_per_epoch: 25      # == n_tasks
    epoch_frames: 25            # max_frames_per_episode=1 → 1 sample per task
    max_frames_per_episode: 1
    cache_dir: /cache/zarr_cache_viz
    pool_size_gb: 10
    lookahead_epochs: 1.0
    n_copy_threads: 4
    prepare_timeout_s: 3600

train_dataloader_params:
  mecka_bimanual:
    batch_size: 128
    num_workers: 12
    persistent_workers: false
    prefetch_factor: 6
    shuffle: true

valid_dataloader_params:
  mecka_bimanual:
    batch_size: 128
    num_workers: 4
    persistent_workers: false
    prefetch_factor: 2
    shuffle: false

train_viz_dataloader_params:
  mecka_bimanual:
    batch_size: 25            # == n_tasks → one batch covers one sample per task
    num_workers: 2
    persistent_workers: false
    prefetch_factor: 2
    shuffle: false
