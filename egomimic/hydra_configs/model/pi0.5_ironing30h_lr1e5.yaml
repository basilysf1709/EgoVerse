defaults:
  - pi0.5_bc_mecka_scratch
  - _self_

# LR-sweep point 1/3 for the ironing_clothes 30h dataset
# (data=mecka_zip_h200_ironing_30h). pi0.5 from scratch + pretrained PaliGemma
# backbone (pass model.robomimic_model.config.paligemma_weight_path at launch).
#
# Cosine-schedule T_max (num_training_steps) = ONE pass over 30h of data:
#   30h × 3600 s/h × 30 fps = 3,240,000 samples ÷ batch_size 64 = 50,625 steps.
# Warmup kept at the pi0.5_base default (2000). num_cycles 0.5 → decay to 0 at T_max.
# (DDP note: 2-GPU global batch is 128, so one true epoch is ~25,313 steps; this
#  follows the literal samples÷64 spec. Halve num_training_steps if you also halve
#  the data batch_size back to 32.)
optimizer:
  lr: 1e-5

scheduler:
  num_training_steps: 50625
